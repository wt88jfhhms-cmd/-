<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영작 훈련소</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --accent: #c8ff00;
    --accent2: #ff6b35;
    --text: #e8e8f0;
    --muted: #666680;
    --border: #2a2a3a;
    --correct: #00ff88;
    --wrong: #ff4466;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(200,255,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,255,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 20px 40px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -1px;
  }

  .subtitle {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .day-badge {
    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 2px 8px;
    letter-spacing: 1px;
  }

  /* progress */
  .progress-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
  }

  .progress-dot {
    flex: 1;
    height: 2px;
    background: var(--border);
    transition: background 0.3s;
  }

  .progress-dot.done { background: var(--accent); }
  .progress-dot.current { background: var(--accent2); }

  /* question card */
  .q-number {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--accent2);
    letter-spacing: 2px;
    margin-bottom: 4px;
  }

  .q-source {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 8px;
    font-family: 'Space Mono', monospace;
  }

  .korean-sentence {
    background: var(--surface);
    border-left: 3px solid var(--accent);
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.65;
    margin-bottom: 10px;
    font-weight: 400;
  }

  .word-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 8px 12px;
    margin-bottom: 10px;
  }

  .word-box-label {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
    font-family: 'Space Mono', monospace;
  }

  .words {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .word-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 3px 8px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }

  .word-chip:hover { border-color: var(--accent); background: rgba(200,255,0,0.05); }
  .word-chip.used { opacity: 0.3; border-style: dashed; }

  /* answer area */
  .answer-area {
    min-height: 44px;
    border: 1px solid var(--border);
    border-top: 2px solid var(--accent2);
    padding: 10px 14px;
    margin-bottom: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    background: var(--surface);
    cursor: text;
    position: relative;
  }

  .answer-area:focus { outline: none; border-color: var(--accent2); }
  .answer-area:empty::before {
    content: '여기에 영작하세요...';
    color: var(--muted);
    pointer-events: none;
  }

  .answer-area[contenteditable="false"] { cursor: default; }

  /* buttons */
  .btn-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 8px 18px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--bg);
    font-weight: 700;
  }

  .btn-primary:hover { background: #d4ff20; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { color: var(--text); border-color: var(--muted); }

  /* feedback */
  .feedback {
    display: none;
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 14px 16px;
    margin-bottom: 12px;
    animation: slideIn 0.3s ease;
  }

  .feedback.show { display: block; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .feedback-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .feedback-label.correct { color: var(--correct); }
  .feedback-label.wrong { color: var(--wrong); }
  .feedback-label.partial { color: var(--accent2); }

  .model-answer {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    line-height: 1.7;
    margin-bottom: 10px;
    padding: 8px 12px;
    background: rgba(200,255,0,0.05);
    border-left: 2px solid var(--accent);
  }

  .feedback-notes {
    font-size: 12px;
    color: var(--text);
    line-height: 1.7;
  }

  .feedback-notes li {
    margin-bottom: 5px;
    padding-left: 14px;
    position: relative;
  }

  .feedback-notes li::before {
    content: '→';
    position: absolute;
    left: 0;
    color: var(--accent2);
    font-family: 'Space Mono', monospace;
  }

  .highlight-correct { color: var(--correct); }
  .highlight-wrong { color: var(--wrong); background: rgba(255,68,102,0.1); padding: 1px 4px; }

  /* score screen */
  .score-screen {
    display: none;
    text-align: center;
    padding: 60px 0;
  }

  .score-screen.show { display: block; }

  .score-big {
    font-family: 'Space Mono', monospace;
    font-size: 80px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 8px;
  }

  .score-label {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 40px;
  }

  .score-detail {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-bottom: 48px;
  }

  .score-item { text-align: center; }
  .score-item-num {
    font-family: 'Space Mono', monospace;
    font-size: 28px;
    color: var(--text);
    margin-bottom: 4px;
  }

  .score-item-label { font-size: 11px; color: var(--muted); letter-spacing: 1px; }

  /* loading */
  .loading {
    text-align: center;
    padding: 80px 0;
  }

  .loading-text {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 3px;
    animation: blink 1s infinite;
  }

  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .q-card { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* streak */
  .streak-info {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .streak-fire { color: var(--accent2); font-size: 13px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <div class="logo">ENGRAFT</div>
      <div class="subtitle">2025 수능 6월 · 영작 훈련</div>
    </div>
    <div class="day-badge" id="dayBadge">DAY 1</div>
  </header>

  <div class="streak-info">
    <span class="streak-fire">🔥</span>
    <span id="streakText">연속 0일째</span>
    <span style="margin-left:auto; color: var(--border)">|</span>
    <span id="totalDone" style="margin-left:8px">총 0문제 완료</span>
  </div>

  <div class="progress-bar" id="progressBar"></div>

  <div class="loading" id="loadingScreen">
    <div class="loading-text">LOADING QUESTIONS...</div>
  </div>

  <div id="quizArea" style="display:none">
    <div class="q-card" id="qCard">
      <div class="q-number" id="qNumber">Q 01 / 05</div>
      <div class="q-source" id="qSource">문항 번호</div>
      <div class="korean-sentence" id="koreanSentence"></div>
      <div class="word-box">
        <div class="word-box-label">주어진 단어 (필요시 변형)</div>
        <div class="words" id="wordChips"></div>
      </div>
      <div class="answer-area" id="answerArea" contenteditable="true" spellcheck="false"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()">제출하기</button>
        <button class="btn btn-secondary" onclick="clearAnswer()">지우기</button>
      </div>
      <div class="feedback" id="feedback">
        <div class="feedback-label" id="feedbackLabel"></div>
        <div class="model-answer" id="modelAnswer"></div>
        <ul class="feedback-notes" id="feedbackNotes"></ul>
        <div class="btn-row" style="margin-top:20px; margin-bottom:0">
          <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">다음 문제 →</button>
        </div>
      </div>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-big" id="scoreBig">0</div>
    <div class="score-label">오늘의 점수</div>
    <div class="score-detail">
      <div class="score-item">
        <div class="score-item-num" id="scoreCorrect">0</div>
        <div class="score-item-label">정확</div>
      </div>
      <div class="score-item">
        <div class="score-item-num" id="scorePartial">0</div>
        <div class="score-item-label">부분</div>
      </div>
      <div class="score-item">
        <div class="score-item-num" id="scoreWrong">0</div>
        <div class="score-item-label">오답</div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="restartToday()" style="margin: 0 auto; display:block">다시 풀기</button>
  </div>
</div>

<script>

// ─── 상태 ────────────────────────────────────────────────────────
let todayQuestions = [];
let currentIdx = 0;
let results = { correct: 0, partial: 0, wrong: 0 };
let streak = 0;
let totalDone = 0;

function getStorageKey(key) {
  return 'engraft_' + key;
}

function loadState() {
  try {
    streak = parseInt(localStorage.getItem(getStorageKey('streak')) || '0');
    totalDone = parseInt(localStorage.getItem(getStorageKey('total')) || '0');
    const lastDate = localStorage.getItem(getStorageKey('lastDate'));
    const today = new Date().toDateString();
    if (lastDate && lastDate !== today) {
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      if (lastDate !== yesterday.toDateString()) streak = 0;
    }
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem(getStorageKey('streak'), streak);
    localStorage.setItem(getStorageKey('total'), totalDone);
    localStorage.setItem(getStorageKey('lastDate'), new Date().toDateString());
  } catch(e) {}
}

function getDayNumber() {
  try {
    const start = localStorage.getItem(getStorageKey('startDate'));
    if (!start) {
      localStorage.setItem(getStorageKey('startDate'), new Date().toDateString());
      return 1;
    }
    const diff = Math.floor((new Date() - new Date(start)) / (1000*60*60*24));
    return diff + 1;
  } catch(e) { return 1; }
}

// ─── 초기화 ──────────────────────────────────────────────────────
function init() {
  loadState();
  document.getElementById('dayBadge').textContent = 'DAY ' + getDayNumber();
  document.getElementById('streakText').textContent = '연속 ' + streak + '일째';
  document.getElementById('totalDone').textContent = '총 ' + totalDone + '문제 완료';

  // 랜덤 5문제
  const shuffled = [...QUESTIONS].sort(() => Math.random() - 0.5);
  todayQuestions = shuffled.slice(0, 5);

  buildProgress();
  setTimeout(() => {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('quizArea').style.display = 'block';
    showQuestion();
  }, 800);
}

function buildProgress() {
  const bar = document.getElementById('progressBar');
  bar.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const dot = document.createElement('div');
    dot.className = 'progress-dot' + (i === 0 ? ' current' : '');
    dot.id = 'pdot' + i;
    bar.appendChild(dot);
  }
}

function updateProgress() {
  for (let i = 0; i < 5; i++) {
    const dot = document.getElementById('pdot' + i);
    if (i < currentIdx) dot.className = 'progress-dot done';
    else if (i === currentIdx) dot.className = 'progress-dot current';
    else dot.className = 'progress-dot';
  }
}

function showQuestion() {
  const q = todayQuestions[currentIdx];
  document.getElementById('qNumber').textContent = 'Q ' + String(currentIdx+1).padStart(2,'0') + ' / 05';
  document.getElementById('qSource').textContent = '문항 ' + q.num + '번 지문';
  document.getElementById('koreanSentence').textContent = q.korean;

  // 단어 칩
  const chipsEl = document.getElementById('wordChips');
  chipsEl.innerHTML = '';
  const shuffledWords = [...q.words].sort(() => Math.random() - 0.5);
  shuffledWords.forEach(w => {
    const chip = document.createElement('div');
    chip.className = 'word-chip';
    chip.textContent = w;
    chip.onclick = () => insertWord(w, chip);
    chipsEl.appendChild(chip);
  });

  // 초기화
  const area = document.getElementById('answerArea');
  area.textContent = '';
  area.contentEditable = 'true';
  document.getElementById('feedback').classList.remove('show');
  document.getElementById('submitBtn').disabled = false;
  updateProgress();
}

function insertWord(word, chip) {
  const area = document.getElementById('answerArea');
  const text = area.textContent;
  area.textContent = text + (text && !text.endsWith(' ') ? ' ' : '') + word;
  chip.classList.add('used');
  // place cursor at end
  const range = document.createRange();
  const sel = window.getSelection();
  range.selectNodeContents(area);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
}

function clearAnswer() {
  document.getElementById('answerArea').textContent = '';
  document.querySelectorAll('.word-chip').forEach(c => c.classList.remove('used'));
}

function normalize(str) {
  return str.toLowerCase()
    .replace(/['']/g, "'")
    .replace(/[""]/g, '"')
    .replace(/[.,;:!?]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function scoreAnswer(userAns, modelAns) {
  const u = normalize(userAns);
  const m = normalize(modelAns);
  if (u === m) return 'correct';

  // word overlap check
  const uWords = new Set(u.split(' '));
  const mWords = m.split(' ');
  const overlap = mWords.filter(w => uWords.has(w)).length;
  const ratio = overlap / mWords.length;
  if (ratio >= 0.75) return 'partial';
  return 'wrong';
}

function submitAnswer() {
  const userAns = document.getElementById('answerArea').textContent.trim();
  if (!userAns) return;

  const q = todayQuestions[currentIdx];
  const score = scoreAnswer(userAns, q.answer);

  document.getElementById('answerArea').contentEditable = 'false';
  document.getElementById('submitBtn').disabled = true;

  const fb = document.getElementById('feedback');
  const label = document.getElementById('feedbackLabel');
  const model = document.getElementById('modelAnswer');
  const notes = document.getElementById('feedbackNotes');

  if (score === 'correct') {
    label.textContent = '✓ CORRECT';
    label.className = 'feedback-label correct';
    results.correct++;
  } else if (score === 'partial') {
    label.textContent = '△ PARTIAL — 모범 답안 확인';
    label.className = 'feedback-label partial';
    results.partial++;
  } else {
    label.textContent = '✗ INCORRECT — 모범 답안 확인';
    label.className = 'feedback-label wrong';
    results.wrong++;
  }

  model.textContent = q.answer;
  notes.innerHTML = q.notes.map(n => `<li>${n}</li>`).join('');

  // update next button text
  document.getElementById('nextBtn').textContent =
    currentIdx < 4 ? '다음 문제 →' : '결과 보기 →';

  fb.classList.add('show');
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function nextQuestion() {
  if (currentIdx < 4) {
    currentIdx++;
    document.getElementById('feedback').classList.remove('show');
    showQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    showScore();
  }
}

function showScore() {
  totalDone += 5;
  streak++;
  saveState();

  document.getElementById('quizArea').style.display = 'none';
  const score = document.getElementById('scoreScreen');
  score.classList.add('show');

  const pct = Math.round((results.correct + results.partial * 0.5) / 5 * 100);
  document.getElementById('scoreBig').textContent = pct + '%';
  document.getElementById('scoreCorrect').textContent = results.correct;
  document.getElementById('scorePartial').textContent = results.partial;
  document.getElementById('scoreWrong').textContent = results.wrong;

  document.getElementById('streakText').textContent = '연속 ' + streak + '일째';
  document.getElementById('totalDone').textContent = '총 ' + totalDone + '문제 완료';

  updateProgress();
  for (let i = 0; i < 5; i++) {
    document.getElementById('pdot'+i).className = 'progress-dot done';
  }
}

function restartToday() {
  currentIdx = 0;
  results = { correct: 0, partial: 0, wrong: 0 };
  const shuffled = [...QUESTIONS].sort(() => Math.random() - 0.5);
  todayQuestions = shuffled.slice(0, 5);
  buildProgress();
  document.getElementById('scoreScreen').classList.remove('show');
  document.getElementById('quizArea').style.display = 'block';
  showQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) submitAnswer();
});

init();
</script>
</body>
</html>
